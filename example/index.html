<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dictionary-popup</title>
  <style>
    body { margin: 0; min-height: 100vh; font: 16px system-ui, sans-serif; background: #30475e; color: #fff; }
    .bar { padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
    #popup { margin: 8px auto; width: min(560px, calc(100% - 24px)); height: 420px; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .8); }
  </style>
</head>
<body>
  <div class="bar">
    <strong>dictionary-popup</strong>
    <button id="theme">Light / dark</button>
    <span id="said"></span>
  </div>
  <div id="popup"></div>
  <script type="module">
    import { createDictionaryPopup } from "../src/index.js";
    import { results, styles } from "./sample.js";

    const said = document.getElementById("said");
    let theme = new URLSearchParams(location.search).get("theme") ?? "dark";
    const popup = createDictionaryPopup(document.getElementById("popup"), {
      // Served as files, which works under a strict Content Security Policy too. Leave `src` out to have it inline.
      src: new URLSearchParams(location.search).has("inline") ? undefined : "../popup/index.html",
      theme,
      lang: "ja",
      onAddCard(result) {
        said.textContent = `Add card: ${result.term.expression}`;
        popup.setAdded([result.term.expression]);
      },
    });
    popup.render(results, { styles });
    document.getElementById("theme").onclick = () => popup.setTheme({ theme: (theme = theme === "dark" ? "light" : "dark") });
    window.popup = popup;
  </script>
</body>
</html>
