<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dictionary-popup</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; font: 16px system-ui, sans-serif; background: linear-gradient(160deg, #30475e, #1b2733 60%, #3b2f4a); color: #fff; display: flex; flex-direction: column; }
    .bar { flex: none; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .stage { flex: 1 1 auto; min-height: 0; position: relative; }
    /* The popup is as wide as this and as tall as its entries, up to this element's max-height. */
    #popup { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 12px); display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>dictionary-popup</strong>
    <select id="theme" aria-label="Theme"></select>
    <span id="said" role="status"></span>
  </div>
  <div class="stage"><div id="popup"></div></div>
  <script type="module">
    import { createDictionaryPopup, THEMES } from "../src/index.js";
    import { results, more, styles, dictionaries } from "./sample.js";

    // ?theme=light for another palette, ?added for a word that's in Anki, ?noaudio for no audio button.
    const ask = new URLSearchParams(location.search);
    const said = document.getElementById("said");
    const popup = createDictionaryPopup(document.getElementById("popup"), {
      theme: ask.get("theme") ?? "default",
      dictionaries,
      onAddCard(result, index) {
        said.textContent = `Adding ${result.term.expression}…`;
        popup.setCardState(index, "adding");
        setTimeout(() => {
          popup.setCardState(index, "in-anki");
          said.textContent = `Added ${result.term.expression}`;
        }, 900);
      },
      onOpenCard: (result) => (said.textContent = `Open ${result.term.expression} in Anki`),
      onPlayAudio: ask.has("noaudio") ? undefined : (result) => (said.textContent = `Play ${result.term.expression}`),
      // A real host asks its dictionaries; this one knows a few words.
      lookup: async (text) => [...results, ...more].filter((result) => text.startsWith(result.term.expression)),
    });
    const theme = document.getElementById("theme");
    theme.append(...THEMES.map((name) => new Option(name)));
    theme.value = ask.get("theme") ?? "default";
    theme.onchange = () => popup.setTheme({ theme: theme.value });
    popup.render(results, { styles, added: ask.has("added") ? ["食べる"] : [] });
    window.popup = popup;
  </script>
</body>
</html>
